name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blf
          POSTGRES_PASSWORD: blf_ci
          POSTGRES_DB: blue_legacy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://blf:blf_ci@localhost:5432/blue_legacy_test
      TEST_DATABASE_URL: postgresql://blf:blf_ci@localhost:5432/blue_legacy_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      RATE_LIMIT_SALT: ci-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
